<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Animus Keynote — Evoluția Spațială și Imersiunea în Assassin's Creed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --hue:202;
  --bg:#04070c;
  --bg2:#0a111a;
  --ink:#f0f6fc;
  --body:#d5e3ef;
  --mute:#a9c0d3;
  --dim:#7f96aa;
  --line:rgba(145,190,225,.22);
  --line-strong:rgba(145,190,225,.42);
  --panel:rgba(7,13,21,.86);
  --panel-alt:rgba(12,22,35,.92);
  --accent:hsl(var(--hue) 78% 64%);
  --accent-soft:hsl(var(--hue) 65% 52% / .15);
  --accent-d:hsl(var(--hue) 45% 34%);
  --eagle:#e8c15a;
  --creed:#e0243f;
  --f-d:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-b:'Instrument Sans','Segoe UI',Arial,sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --pb:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.6 var(--f-b);
  overflow:hidden;
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
#ghost{
  position:fixed;
  right:max(20px,env(safe-area-inset-right,0px));
  bottom:calc(46px + env(safe-area-inset-bottom,0px));
  z-index:1;
  pointer-events:none;
  font:900 clamp(110px,18vw,280px)/.8 var(--f-d);
  font-stretch:112%;
  letter-spacing:-.02em;
  color:transparent;
  -webkit-text-stroke:1px hsl(var(--hue) 55% 65% / .035);
  font-variant-numeric:tabular-nums;
}
#crest-bg{
  position:fixed;
  left:50%;top:50%;
  width:min(54vh,54vw);height:min(54vh,54vw);
  transform:translate(-50%,-50%);
  z-index:1;pointer-events:none;
  opacity:.022;
  color:var(--accent);
  transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.2,1);
}
.hud{
  position:fixed;left:0;right:0;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:calc(9px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(4,7,12,.96),rgba(4,7,12,.78) 72%,rgba(4,7,12,0));
  border-bottom:1px solid rgba(145,190,225,.1);
}
.brand{font:600 12.5px var(--f-m);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand svg{width:20px;height:20px;fill:var(--creed);filter:drop-shadow(0 0 6px rgba(224,36,63,.5));flex-shrink:0}
.ticks{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
.ticks button{flex:0 1 24px;height:18px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}
.ticks button::after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:var(--dim);transition:background .3s,height .3s,top .3s}
.ticks button.on::after{background:var(--accent);height:5px;top:6px;box-shadow:0 0 8px var(--accent)}
.ticks button.done::after{background:var(--accent-d)}
.cnt{font:600 12.5px var(--f-m);color:var(--mute);letter-spacing:.1em;white-space:nowrap}
.hb{display:flex;gap:6px;align-items:center}
.chip{
  font:600 12.5px var(--f-m);letter-spacing:.09em;text-transform:uppercase;
  padding:7px 11px;border:1px solid var(--line);
  background:rgba(8,15,24,.8);color:var(--ink);
  cursor:pointer;border-radius:2px;white-space:nowrap;transition:border-color .2s,background .2s;
}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#04070c;border-color:var(--accent)}
@media(max-width:820px){.brand span,.ticks{display:none}.hud{justify-content:space-between}.chip{padding:6px 8px;font-size:10px}}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(4,7,12,.96),rgba(4,7,12,.8) 70%,rgba(4,7,12,0));
  border-top:1px solid rgba(145,190,225,.1);
}
.nav .ft{flex:1;min-width:0;font:600 12.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.nav .ft i{display:inline-block;width:6px;height:6px;background:var(--accent);transform:rotate(45deg);flex-shrink:0}
.sync{flex:1.2;height:4px;background:var(--line);position:relative;min-width:40px;overflow:hidden}
.sync b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent-d),var(--accent));transition:width .2s}
.nb{width:42px;height:34px;border:1px solid var(--line);background:rgba(8,15,24,.8);cursor:pointer;border-radius:2px;font-size:16px;transition:border-color .2s,color .2s}
.nb:hover{border-color:var(--accent);color:var(--accent)}
.nb:disabled{opacity:.3;cursor:default}

#stage{
  position:fixed;z-index:5;
  left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  top:calc(50px + env(safe-area-inset-top,0px));
  bottom:calc(52px + env(safe-area-inset-bottom,0px) + var(--pb));
  transition:bottom .4s;
}
.slide{
  position:absolute;inset:0;display:none;
  overflow-y:auto;overflow-x:hidden;
  padding:8px 8px 24px;
  scrollbar-width:thin;scrollbar-color:var(--dim) transparent;
}
.slide.on{display:flex;flex-direction:column}
.in{
  width:100%;max-width:1280px;margin:auto;
  display:flex;flex-direction:column;
  gap:clamp(22px,3.4vh,40px);
  padding:4px 0;
}
.rise{animation:rise .7s cubic-bezier(.16,.84,.24,1) backwards;animation-delay:calc(var(--i,0)*65ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px);filter:blur(5px)}}
@keyframes stretch{from{font-stretch:74%;letter-spacing:.07em;opacity:0}}
h1,h2,h3{margin:0}
h2.k,h1.k{
  font-family:var(--f-d);font-weight:800;text-transform:uppercase;
  line-height:.98;letter-spacing:-.005em;text-wrap:balance;
  color:var(--ink);
  animation:stretch .85s cubic-bezier(.2,.9,.2,1) .08s backwards;
}
h2.k{font-size:clamp(26px,3.3vw,44px)}
h1.k{font-size:clamp(26px,3.2vw,42px);max-width:24ch}
h3{font:700 clamp(17px,1.45vw,21px)/1.22 var(--f-d);font-stretch:92%;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.kicker{font:600 14px var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:7px;height:7px;background:var(--creed);transform:rotate(45deg);display:inline-block;flex-shrink:0}
.lead{font-size:clamp(18px,1.4vw,21px);color:var(--body);max-width:75ch;margin:0;line-height:1.5}
p{margin:0}
.mono{font-family:var(--f-m)}
.note{font:500 14.5px/1.5 var(--f-m);color:#9ab0c4}
.small{font-size:clamp(16.5px,1.3vw,19px);color:var(--body);line-height:1.52}
.small b,.lead b,li b{color:var(--ink);font-weight:600}
em{color:var(--ink);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g2{display:grid;grid-template-columns:1.12fr 1fr;gap:clamp(24px,3.2vw,52px);align-items:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3vw,48px);align-items:stretch}
.g2>*,.g3>*{min-width:0}
.g2.w{grid-template-columns:1.5fr 1fr}
@media(max-width:960px){.g2,.g2.w{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}

.card{
  position:relative;
  padding:20px 2px 0;
  background:none;
  border:0;border-top:1px solid var(--line-strong);
  display:flex;flex-direction:column;gap:12px;
}
.g3>.rise>.card,.g3>.card{height:100%}
.card.crimson-edge{border-top-color:var(--creed)}
.card-watermark{
  position:absolute;right:-12px;bottom:-14px;width:96px;height:96px;
  opacity:.07;pointer-events:none;fill:var(--accent);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crest-badge{
  display:none!important;width:34px;height:34px;border:1px solid var(--line-strong);
  background:rgba(4,8,15,.85);place-items:center;flex-shrink:0;
  border-radius:2px;
}
.crest-badge svg{width:20px;height:20px;fill:var(--accent)}

.btn{
  font:600 13px var(--f-m);letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border:1px solid var(--line);
  background:rgba(10,18,28,.84);cursor:pointer;border-radius:2px;
  transition:border-color .2s,background .2s,color .2s,box-shadow .2s;
}
.btn:hover{border-color:var(--accent);box-shadow:0 0 12px hsl(var(--hue) 70% 50% / .2)}
.btn.on,.btn.pri{background:var(--accent);color:#04070c;border-color:var(--accent);font-weight:700}
kbd{font:600 11px var(--f-m);border:1px solid var(--line);padding:1px 6px;border-radius:2px;color:var(--ink);background:rgba(8,15,24,.7)}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0;cursor:pointer}
canvas.sim{
  display:block;
  width:auto;
  max-width:100%;
  max-height:min(44vh,430px);
  height:auto;
  margin:0 auto;
  border:1px solid var(--line);
  background:#02050a;
  touch-action:none;
  object-fit:contain;
}
.big{font:900 clamp(28px,3.2vw,46px)/.96 var(--f-d);font-stretch:96%;font-variant-numeric:tabular-nums;color:var(--accent)}
.lab{font:600 13.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:#9ab0c4}
.stat{display:flex;flex-direction:column;gap:4px}
.count{display:flex;align-items:baseline;gap:12px;font-family:var(--f-d);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.count b{font:900 clamp(48px,6.5vw,92px)/.9 var(--f-d);font-stretch:100%;color:var(--ink);letter-spacing:-.02em}
.count span{font:700 clamp(22px,2.5vw,34px) var(--f-d);color:var(--accent)}
.clabel{font:600 13px var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.era .big{font-size:clamp(28px,3.2vw,42px);color:var(--accent)}
.era .yr{font:600 13px var(--f-m);letter-spacing:.14em;color:var(--accent)}
.era ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;color:var(--body);line-height:1.48}
.era li{padding-left:11px;border-left:2px solid var(--line-strong)}

.brow{display:grid;grid-template-columns:minmax(120px,195px) minmax(0,1fr) 86px;gap:10px;align-items:center;padding:3px 0;cursor:pointer;font-size:15.5px}
.brow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9ab0c4}
.brow .n b{color:var(--ink);font-weight:600}
.brow .v{font:600 14.5px var(--f-m);text-align:right;font-variant-numeric:tabular-nums;color:var(--body)}
.btrack{position:relative;height:12px;background:rgba(145,190,225,.08)}
.bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c,var(--accent));transition:width .85s cubic-bezier(.2,.8,.2,1),filter .2s}
.bar.hatch{background:repeating-linear-gradient(45deg,var(--c,var(--accent)) 0 5px,transparent 5px 9px)}
.brow:hover .n,.brow:focus .n{color:var(--ink)}
.brow:hover .bar,.brow:focus .bar{filter:brightness(1.25)}
.axis{display:grid;grid-template-columns:minmax(120px,195px) minmax(0,1fr) 86px;gap:10px;margin-top:4px}
.ax{position:relative;height:22px;font:500 13px var(--f-m);color:#9ab0c4;overflow:visible}
.ax i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;white-space:nowrap}
.lim{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--creed);z-index:2}
.bdet{min-height:2.6em;font-size:16.5px;color:var(--ink);padding:9px 14px;background:var(--panel-alt);border-left:3px solid var(--accent)}

.tw{overflow:auto;max-height:44vh;border:1px solid var(--line);background:rgba(4,8,14,.85)}
table{border-collapse:collapse;min-width:780px;width:100%;font-size:15.5px}
th{position:sticky;top:0;background:var(--bg2);text-align:left;font:600 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:10px 12px;border-bottom:1px solid var(--line-strong);z-index:2}
td{padding:9px 12px;border-bottom:1px solid rgba(145,190,225,.1);vertical-align:top;color:var(--body);line-height:1.48}
td:first-child{color:var(--ink);font-weight:600}
tr:hover td{background:rgba(145,190,225,.05)}
mark{background:hsl(var(--hue) 70% 50% / .35);color:var(--ink);padding:0 2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
input.s{background:rgba(8,15,24,.9);border:1px solid var(--line);padding:8px 12px;color:var(--ink);min-width:0;flex:1 1 220px;border-radius:2px}

.facade{width:auto;max-width:100%;max-height:min(42vh,400px);height:auto;margin:0 auto;display:block;border:1px solid var(--line);background:rgba(2,5,10,.86);object-fit:contain}
.part{cursor:pointer;transition:filter .25s,stroke .25s}
.facade .ev-only{opacity:0;transition:opacity .4s}
.facade.ev .ev-only{opacity:1}
.facade.ev .part{filter:drop-shadow(0 0 6px var(--eagle))}
.facade.ev .part *{stroke:var(--eagle);stroke-width:1.8}
.part:hover,.part:focus,.part.act{filter:drop-shadow(0 0 9px var(--accent)) brightness(1.35)}

.zrow{display:grid;gap:4px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);opacity:.55;transition:opacity .25s,border-color .25s,background .25s;cursor:pointer}
.zrow.on{opacity:1;border-color:var(--accent);background:var(--panel-alt)}
.zrow b{font:700 17.5px var(--f-d);text-transform:uppercase;font-stretch:92%;color:var(--accent)}
.zrow span{font-size:16.5px;color:var(--body);line-height:1.45}

.flip{perspective:1000px;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:block;width:100%;height:100%}
.flip .fi{position:relative;display:grid;width:100%;height:100%;min-height:175px;transition:transform .65s cubic-bezier(.3,.8,.2,1);transform-style:preserve-3d}
.flip.f .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{grid-area:1/1;padding:15px 17px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:7px;overflow:hidden}
.flip .fb{transform:rotateY(180deg);border-color:var(--accent);background:var(--panel-alt)}
.flip h3{font-size:17px;color:var(--ink)}
.flip p{font-size:16.5px;color:var(--body);line-height:1.48}
.flip .fb p{color:var(--ink)}
.tag{font:600 13.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:960px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.node{padding:12px;border:1px solid var(--line);background:var(--panel);font-size:15.5px;color:var(--body);cursor:pointer;text-align:left;opacity:.55;transition:opacity .3s,border-color .3s;line-height:1.4}
.node.on{opacity:1;border-color:var(--accent);color:var(--ink);background:var(--panel-alt)}
.node b{display:block;font:700 16px var(--f-d);text-transform:uppercase;font-stretch:90%;color:var(--accent);margin-bottom:4px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:grid;gap:8px}
.layer{padding:12px 15px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;display:grid;gap:4px;transition:border-color .25s,background .25s}
.layer.on{border-color:var(--accent);background:var(--panel-alt)}
.layer b{font:700 17.5px var(--f-d);text-transform:uppercase;font-stretch:92%;color:var(--accent)}
.layer span{font-size:16.5px;color:var(--body);line-height:1.46}
.dtbox svg{display:block;width:100%;max-height:min(42vh,380px);height:auto}
.dtbox .g-game,.dtbox .g-tour{transition:opacity .5s}
.dtbox.tour .g-game{opacity:.1}.dtbox:not(.tour) .g-tour{opacity:0}
.ring{width:min(165px,42vw);height:auto;flex-shrink:0}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:butt;transition:stroke-dashoffset 2.2s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--ink);font:900 28px var(--f-d)}

.prompt{
  position:fixed;z-index:30;
  left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(50px + env(safe-area-inset-bottom,0px));
  height:clamp(180px,32vh,300px);display:flex;flex-direction:column;
  background:rgba(3,6,11,.95);border:1px solid var(--line-strong);
  backdrop-filter:blur(12px);translate:0 130%;transition:translate .4s cubic-bezier(.2,.8,.2,1);
}
.prompt.open{translate:0 0}
.ptool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ptool label{display:flex;align-items:center;gap:8px;font:600 12px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ptool input{width:90px}
.pbody{position:relative;overflow-y:auto;padding:14px clamp(14px,5vw,70px) 80px;scrollbar-width:thin;font-size:var(--pfs,24px);line-height:1.48;font-weight:500}
.pbody h4{margin:22px 0 6px;font:600 11px var(--f-m);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.pbody p{color:var(--dim);transition:color .3s}
.pbody p.cur{color:var(--mute)}
.pbody span{transition:color .2s}
.pbody span.r{color:var(--ink)}
.pbody span.c{color:var(--accent)}

#idx{
  position:fixed;inset:0;z-index:70;background:rgba(2,4,8,.94);backdrop-filter:blur(10px);overflow:auto;
  padding:calc(30px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));
}
#idx .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-width:1160px;margin:18px auto}
#idx button.it{display:grid;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:border-color .2s,background .2s}
#idx button.it:hover,#idx button.it.on{border-color:var(--accent);background:var(--panel-alt)}
#idx button.it small{font:600 12px var(--f-m);letter-spacing:.16em;color:var(--accent)}
#idx button.it b{font:700 16px var(--f-d);text-transform:uppercase;font-stretch:90%;color:var(--ink)}


.acc{display:grid;gap:8px}
.ag{border:1px solid var(--line);background:var(--panel);border-radius:2px;overflow:hidden;transition:border-color .25s,background .25s}
.ag.open{border-color:var(--accent);background:var(--panel-alt)}
.ah{display:flex;align-items:center;gap:16px;width:100%;padding:14px 20px;background:none;border:0;cursor:pointer;text-align:left}
.ah b{font:700 18px var(--f-d);font-stretch:92%;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);flex:1}
.ah .n{font:600 14px var(--f-m);color:var(--accent);white-space:nowrap}
.ah i{width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .3s,margin .3s;margin-top:-4px;flex-shrink:0}
.ag.open .ah i{transform:rotate(-135deg);margin-top:4px}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}

function mBars(root){

 rows.forEach(r=>{const f=()=>{const i=+r.dataset.i;det.textContent=BARS[i].d};r.addEventListener('pointerenter',f);r.addEventListener('focus',f);r.addEventListener('click',f)});

}

   playing=!playing;if(playing&&ac.state==='suspended')ac.resume();btn.classList.toggle('on',playing);btn.textContent=playing?SLIDES.verticala.soundOff:SLIDES.verticala.soundOn;upd();
  }catch(e){btn.textContent=SLIDES.verticala.soundNone}
 };
 upd();
 return{off(){playing=false;if(ac){upd();clearInterval(iv);iv=null;ac.close().catch(()=>{});ac=null}}};
}

function mPal(root){
 const ls=$$('.layer',root);
 ls.forEach(b=>b.onclick=()=>{
  const idx=+b.dataset.l;
  ls.forEach(q=>q.classList.toggle('on',q===b));
  [0,1,2].forEach(i=>{const g=$('#pL'+i,root);if(g)g.setAttribute('opacity',i===idx?'1':'.35')});
 });
 return{};
}

function mFlow(root){
 const ns=$$('.node',root),tx=$('#rTxt',root);let k=0,iv;
 const TXT={W:SLIDES.atasament.westText,M:SLIDES.atasament.middleEastText};
 const set=w=>{tx.textContent=TXT[w];$('#rW',root).classList.toggle('on',w==='W');$('#rM',root).classList.toggle('on',w==='M')};
 $('#rW',root).onclick=()=>set('W');$('#rM',root).onclick=()=>set('M');set('M');
 const lite=i=>ns.forEach((n,j)=>n.classList.toggle('on',j<=i));
 ns.forEach((n,i)=>n.onclick=()=>{clearInterval(iv);lite(i)});
 lite(0);iv=setInterval(()=>{k=(k+1)%(ns.length+2);lite(Math.min(k,ns.length-1))},1400);
 return{off(){clearInterval(iv)}};
}

function mLies(root){$$('.flip',root).forEach(b=>b.onclick=()=>b.classList.toggle('f'));return{}}

function mDT(root){
 const b=$('#dt',root),g=$('#dtG',root),t=$('#dtT',root),p=$('#dtP',root);
 const P={g:SLIDES.discovery.gameText,t:SLIDES.discovery.tourText};
 const set=v=>{b.classList.toggle('tour',v);g.classList.toggle('on',!v);t.classList.toggle('on',v);p.textContent=v?P.t:P.g};
 g.onclick=()=>set(false);t.onclick=()=>set(true);set(false);return{};
}

function mEnd(root){
 const acc=$('#acc',root);
 const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
 const pair=r=>`<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`;
 const G=BIBLIO.map(b=>b.from==='games'?{n:b.title,s:b.unit,rows:GAMES,f:g=>`<b>${esc(g.title)} (${g.year})</b><span>${esc(g.setting)} · ${esc(g.land)} km² · ${esc(g.engine)}</span>`}
  :b.from==='lynch'?{n:b.title,s:b.unit,rows:LYNCH,f:l=>`<b>${esc(l.term)}</b><span>${esc(l.def)}</span>`}
  :b.from==='sources'?{n:b.title,s:b.unit,rows:SOURCES,f:r=>`<b>${esc(r[2])}</b><span>${esc(r[1])}</span>`}
  :{n:b.title,s:b.unit,rows:b.rows,f:pair});
 acc.innerHTML=G.map((g,i)=>`<div class="ag" data-i="${i}"><button class="ah" aria-expanded="false"><b>${g.n}</b><span class="n">${g.rows.length} ${g.s}</span><i></i></button><div class="ab"><div><div class="al">${g.rows.map(r=>`<div class="it2">${g.f(r)}</div>`).join('')}</div></div></div></div>`).join('');
 $$('.ag',acc).forEach(el=>{
  const btn=$('.ah',el);
  btn.onclick=()=>{
   const was=el.classList.contains('open');
   $$('.ag',acc).forEach(o=>{o.classList.remove('open');$('.ah',o).setAttribute('aria-expanded','false')});
   if(!was){el.classList.add('open');btn.setAttribute('aria-expanded','true');setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),380)}
  };
 });
 return{};
}

const stage=$('#stage'),bg=$('#bg'),bx=bg.getContext('2d'),fxc=$('#fx'),fxx=fxc.getContext('2d'),ghost=$('#ghost');
const S={i:-1,busy:false,pend:null,hue:202,hueT:202,yr:2007,yrT:2007,reel:false,cur:null};
const DPR=Math.min(devicePixelRatio||1,1.5);
let BW=0,BH=0;
function resize(){BW=innerWidth;BH=innerHeight;bg.width=BW*DPR;bg.height=BH*DPR;fxc.width=BW*DPR;fxc.height=BH*DPR}
addEventListener('resize',resize);resize();

SL.forEach((s,i)=>{const e=document.createElement('section');e.className='slide';e.id='s'+i;e.setAttribute('aria-label',s.t);e.innerHTML=s.html;stage.appendChild(e);s.el=e});
const ticks=$('#ticks');
SL.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`${i+1}. ${s.t}`);b.title=`${i+1}. ${s.t}`;b.onclick=()=>go(i);ticks.appendChild(b);
});

const NODES_CNT=34;
const rNet=rng(42);
const NET_NODES=[...Array(NODES_CNT)].map((_,i)=>({
 x:rNet(),
 y:rNet(),
 vx:(rNet()-.5)*.028,
 vy:(rNet()-.5)*.028,
 z:.35+rNet()*.65,
 hub:i%11===0,
 ph:rNet()*6.283
}));
const NET_PULSES=[...Array(6)].map((_,i)=>({
 a:i%NODES_CNT,
 b:(i*7+3)%NODES_CNT,
 p:rNet(),
 sp:.55+rNet()*.9
}));

const FX={
 data:{n:14,vx:[0,0],vy:[32,85],s:[10,13],c:'hsla(H,75%,65%,',a:[.08,.32],sh:'g'},
 dust:{n:16,vx:[8,22],vy:[-3,5],s:[1,2],c:'hsla(H,55%,70%,',a:[.1,.35],sh:'d'},
 petals:{n:14,vx:[8,24],vy:[18,40],s:[2.5,4.8],c:'hsla(H,60%,75%,',a:[.22,.58],sh:'p'},
 spray:{n:16,vx:[20,50],vy:[-5,5],s:[1,2],c:'hsla(H,60%,80%,',a:[.12,.4],sh:'d'},
 leaves:{n:14,vx:[8,26],vy:[20,44],s:[2.5,4.8],c:'hsla(H,65%,62%,',a:[.22,.58],sh:'p'},
 motes:{n:16,vx:[-5,5],vy:[-10,-2],s:[1,2],c:'hsla(H,70%,75%,',a:[.1,.38],sh:'d'}
};
const PS=[...Array(60)].map(()=>({x:0,y:0,u:Math.random(),v:Math.random(),w:Math.random(),f:0,i:0}));
let fxType='data',scNow='grid',scOld='grid',scMix=1;
function spawn(p,init){const f=FX[fxType]||FX.data,W=BW,H=BH;p.x=Math.random()*W;p.y=init?Math.random()*H:(f.vy[1]<0?H+10:-10);p.f=init?0:p.f;p.sp=lerp(f.s[0],f.s[1],p.u);p.vx=lerp(f.vx[0],f.vx[1],p.v);p.vy=lerp(f.vy[0],f.vy[1],p.w);p.a=lerp(f.a[0],f.a[1],p.u)}
PS.forEach((p,i)=>{p.i=i;spawn(p,true)});

function drawBG(dt,t){
 const W=BW*DPR,H=BH*DPR,h=Math.round(S.hue),s=dt/1000;
 bx.setTransform(1,0,0,1,0,0);bx.clearRect(0,0,W,H);
 const g=bx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,`hsl(${h} 45% 4%)`);
 g.addColorStop(.65,`hsl(${h} 40% 8%)`);
 g.addColorStop(1,`hsl(${h} 45% 4%)`);
 bx.fillStyle=g;bx.fillRect(0,0,W,H);

 // Subtle perspective Animus floor grid
 const hz=H*.68;
 bx.strokeStyle=`hsla(${h},70%,60%,.03)`;bx.lineWidth=DPR;bx.beginPath();
 for(let i=-14;i<=14;i++){bx.moveTo(W/2+i*32*DPR,hz);bx.lineTo(W/2+i*W*.085,H)}
 for(let k=0;k<8;k++){const z=((k+(t*.00025)%1)/8),y=hz+Math.pow(z,2.1)*(H-hz);bx.moveTo(0,y);bx.lineTo(W,y)}
 bx.stroke();

 // Update interconnected Animus nodes
 NET_NODES.forEach(n=>{
  n.x+=n.vx*s;n.y+=n.vy*s;
  if(n.x<.02||n.x>.98)n.vx=-n.vx;
  if(n.y<.04||n.y>.96)n.vy=-n.vy;
 });

 // Draw proximity connections & triangular memory facets
 const maxDist=Math.min(W,H)*.21,maxD2=maxDist*maxDist;
 bx.lineWidth=DPR;
 for(let i=0;i<NODES_CNT;i++){
  const a=NET_NODES[i],ax=a.x*W,ay=a.y*H;
  for(let j=i+1;j<NODES_CNT;j++){
   const b=NET_NODES[j],bx2=b.x*W,by2=b.y*H;
   const dx=ax-bx2,dy=ay-by2,d2=dx*dx+dy*dy;
   if(d2<maxD2){
    const al=(1-Math.sqrt(d2)/maxDist)*.11;
    bx.strokeStyle=`hsla(${h},75%,65%,${al.toFixed(3)})`;
    bx.beginPath();bx.moveTo(ax,ay);bx.lineTo(bx2,by2);bx.stroke();
   }
  }
 }

 // Draw synaptic data pulses traveling between nodes
 NET_PULSES.forEach(pl=>{
  pl.p+=s*pl.sp*.45;
  if(pl.p>=1){pl.p=0;pl.a=pl.b;pl.b=(pl.a+1+Math.floor(Math.random()*12))%NODES_CNT}
  const n1=NET_NODES[pl.a],n2=NET_NODES[pl.b];
  const px=lerp(n1.x,n2.x,pl.p)*W,py=lerp(n1.y,n2.y,pl.p)*H;
  bx.fillStyle='#e8c15a';
  bx.beginPath();bx.arc(px,py,2.2*DPR,0,7);bx.fill();
 });

 // Draw nodes & hub rings
 NET_NODES.forEach(n=>{
  const nx=n.x*W,ny=n.y*H,r=(n.hub?3.4:1.9)*DPR*n.z;
  bx.fillStyle=n.hub?'#e8c15a':`hsla(${h},80%,72%,.65)`;
  bx.beginPath();bx.arc(nx,ny,r,0,7);bx.fill();
  if(n.hub){
   const pr=r+(3+Math.sin(t*.003+n.ph)*2)*DPR;
   bx.strokeStyle=`hsla(${h},85%,70%,.28)`;
   bx.beginPath();bx.arc(nx,ny,pr,0,7);bx.stroke();
  }
 });

 // Ambient atmospheric particles
 const f=FX[fxType]||FX.data,pre=f.c.replace('H',h),lim=REDUCED?10:f.n;
 PS.forEach(p=>{
  if(p.i>=lim)return;
  p.f=Math.min(1,p.f+s);p.x+=p.vx*s;p.y+=p.vy*s;
  if(p.y>BH+14||p.y<-14||p.x>BW+14||p.x<-14)spawn(p,false);
  const px=p.x*DPR,py=p.y*DPR;
  bx.fillStyle=pre+(p.a*p.f).toFixed(3)+')';
  if(f.sh==='g'){bx.font=`${p.sp*DPR}px JetBrains Mono,monospace`;bx.fillText(p.u>.5?'1':'0',px,py)}
  else if(f.sh==='p'){bx.save();bx.translate(px,py);bx.rotate(t*.001*p.v+p.u*6);bx.beginPath();bx.ellipse(0,0,p.sp*DPR,p.sp*.55*DPR,0,0,7);bx.fill();bx.restore()}
  else{bx.beginPath();bx.arc(px,py,p.sp*DPR*.5,0,7);x_arc:bx.fill()}
 });

 const vg=bx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.95);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');
 bx.fillStyle=vg;bx.fillRect(0,0,W,H);
}

/* ============ TRANZIȚIE · „SINCRONIZARE ANIMUS" (voal luminos + emblemă) ============ */
const WP={on:false,t0:0,dur:1400,target:0,swapped:false,hue:202,dir:1};
const MOTES=[...Array(28)].map((_,i)=>{const q=rng(900+i);return{y:q(),o:q(),s:.7+q()*1.6,g:q()>.45,ph:q()*6.28}});
const sm3=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function drawWipe(p){
 const w=fxc.width,h=fxc.height,cx=w/2,cy=h/2,D=WP.dir;
 fxx.setTransform(1,0,0,1,0,0);fxx.clearRect(0,0,w,h);
 const a=ease(clamp(p/.5,0,1)),b=ease(clamp((p-.5)/.5,0,1));
 const F=w*.26,e1=lerp(0,w+F,a),e2=lerp(-F,w,b);
 const rgb=hsl2rgb(S.hue,78,64).map(v=>Math.round(v)),AC=rgb.join(',');
 const alphaAt=x=>sm3(0,1,(e1-x)/F)*sm3(0,1,(x-e2)/F);
 fxx.save();
 if(D<0){fxx.translate(w,0);fxx.scale(-1,1)}
 /* voal */
 if(e1>e2){
  const g=fxx.createLinearGradient(e2,0,e1,0),n=32;
  for(let k=0;k<=n;k++){const t=k/n,x=e2+(e1-e2)*t;g.addColorStop(t,`rgba(4,8,14,${(alphaAt(x)*.97).toFixed(3)})`)}
  fxx.fillStyle=g;fxx.fillRect(e2,0,e1-e2,h);
  const cov=alphaAt(cx);
  if(cov>.01){
   const rg=fxx.createRadialGradient(cx,cy,0,cx,cy,h*.85);
   rg.addColorStop(0,`rgba(${AC},${(.20*cov).toFixed(3)})`);rg.addColorStop(.55,`rgba(${AC},${(.05*cov).toFixed(3)})`);rg.addColorStop(1,`rgba(${AC},0)`);
   fxx.fillStyle=rg;fxx.fillRect(0,0,w,h);
  }
 }
 /* fascicul de lumină pe marginile voalului */
 const beam=(x,k)=>{
  if(k<=.01||x<-F||x>w+F)return;
  const bw=F*.36,cg=fxx.createLinearGradient(x-bw,0,x+bw,0);
  cg.addColorStop(0,`rgba(${AC},0)`);cg.addColorStop(.5,`rgba(${AC},${(.2*k).toFixed(3)})`);cg.addColorStop(1,`rgba(${AC},0)`);
  fxx.fillStyle=cg;fxx.fillRect(x-bw,0,bw*2,h);
  const lg=fxx.createLinearGradient(0,0,0,h);
  lg.addColorStop(0,'rgba(255,236,190,0)');lg.addColorStop(.5,`rgba(255,240,205,${(.9*k).toFixed(3)})`);lg.addColorStop(1,'rgba(255,236,190,0)');
  fxx.fillStyle=lg;fxx.fillRect(x-DPR*.75,0,DPR*1.5,h);
 };
 const x1=e1-F*.5,x2=e2+F*.5;
 beam(x1,1);beam(x2,b>.02?1:0);
 /* particule fine de lumină */
 MOTES.forEach(m=>{
  [[x1,1],[x2,b>.02?.8:0]].forEach(([bx0,k])=>{
   if(k<=0)return;
   const x=bx0-F*.5*(m.o-.1)+Math.sin(p*7+m.ph)*6*DPR,y=m.y*h+Math.cos(p*5+m.ph)*10*DPR;
   if(x<0||x>w)return;
   const al=(.25+.75*(1-m.o))*k*.85;
   fxx.fillStyle=m.g?`rgba(255,220,140,${al})`:`rgba(${AC},${al})`;
   fxx.beginPath();fxx.arc(x,y,m.s*DPR,0,7);fxx.fill();
  });
 });
 fxx.restore();
 /* emblemă + titlu în centru */
 const c=sm3(.3,.5,p)*(1-sm3(.56,.8,p));
 if(c>.01){
  const size=Math.min(w,h)*.2*(.88+.12*ease(clamp((p-.28)/.45,0,1)));
  fxx.save();
  fxx.shadowColor=`rgba(232,193,90,${.7*c})`;fxx.shadowBlur=34*DPR;
  drawCrestCanvas(fxx,cx,cy-size*.08,size,`rgba(${AC},${(.14*c).toFixed(3)})`,`rgba(240,205,120,${(.95*c).toFixed(3)})`);
  fxx.restore();
  const ly=cy+size*.5+14*DPR,lw=w*.1*c;
  [[-1],[1]].forEach(([d])=>{
   const x0=cx+d*(size*.62),x1b=x0+d*lw,g=fxx.createLinearGradient(x0,0,x1b,0);
   g.addColorStop(0,`rgba(240,205,120,${.7*c})`);g.addColorStop(1,'rgba(240,205,120,0)');
   fxx.fillStyle=g;fxx.fillRect(Math.min(x0,x1b),cy-DPR*.5,Math.abs(x1b-x0),DPR);
  });
  fxx.font=`600 ${Math.round(13*DPR)}px "JetBrains Mono",ui-monospace,Menlo,monospace`;
  fxx.textAlign='center';fxx.textBaseline='top';
  if('letterSpacing' in fxx)fxx.letterSpacing=`${3*DPR}px`;
  fxx.fillStyle=`rgba(213,227,239,${.9*c})`;
  fxx.fillText(SL[WP.target].t.toUpperCase(),cx,ly+size*.06);
  if('letterSpacing' in fxx)fxx.letterSpacing='0px';
 }
}

function setTargets(n){const s=SL[n];S.hueT=s.hue;S.yrT=s.year;scOld=scNow;scNow=s.scene;scMix=0;
 if(s.fx!==fxType){fxType=s.fx;PS.forEach(p=>{p.f=0;spawn(p,true)})}}
function go(n){n=clamp(n,0,N-1);if(n===S.i&&!S.busy)return;if(S.busy){S.pend=n;return}
 if(n===S.i)return;
 if(S.i<0||REDUCED){setTargets(n);if(REDUCED){S.hue=S.hueT;S.yr=S.yrT}swap(n);return}
 S.busy=true;WP.on=true;WP.t0=performance.now();WP.dir=n>S.i?1:-1;WP.target=n;WP.swapped=false;WP.hue=SL[n].hue;setTargets(n)}

function swap(n){
 if(S.cur&&S.cur.off)S.cur.off();S.cur=null;
 if(S.i>=0)SL[S.i].el.classList.remove('on');
 S.i=n;const s=SL[n];s.el.classList.add('on');s.el.scrollTop=0;
 s.el.querySelectorAll('.rise').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''});
 s.el.querySelectorAll('h1.k,h2.k').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''});
 S.cur=s.mount?s.mount(s.el):null;
 $$('#ticks button').forEach((b,i)=>{b.classList.toggle('on',i===n);b.classList.toggle('done',i<n)});
 $('#cnt2').textContent=String(n+1).padStart(2,'0')+' / '+N;$('#ft').textContent=s.t;
 $('#prev').disabled=n===0;$('#next').disabled=n===N-1;
 try{history.replaceState(null,'','#'+(n+1))}catch(e){}
 const cb=$('#crest-bg');if(cb)cb.style.transform=`translate(-50%,-50%) scale(${1+(n%3)*.04})`;
}

function ghostTick(dt){
 S.yr+=(S.yrT-S.yr)*(1-Math.exp(-dt/220));
 ghost.textContent=Math.round(S.yr);
 S.hue+=(S.hueT-S.hue)*(1-Math.exp(-dt/260));
 document.documentElement.style.setProperty('--hue',S.hue.toFixed(1));
}

const ACT={
 next:()=>go(S.i+1),
 prev:()=>go(S.i-1),
 restart:()=>go(0)
};

document.addEventListener('click',e=>{
 const b=e.target.closest&&e.target.closest('[data-act]');
 if(b&&ACT[b.dataset.act])ACT[b.dataset.act]();
});

addEventListener('keydown',e=>{
 if(e.target.matches&&e.target.matches('input,textarea,select'))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(S.i+1)}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(S.i-1)}
 else if(k==='Home')go(0);else if(k==='End')go(N-1);
});

let tsx=0,tsy=0;
stage.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{
 if(e.target.closest('canvas,input,button,.tw,svg,.flip'))return;
 const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(S.i+(dx<0?1:-1));
},{passive:true});

let lt=performance.now();
function frame(t){
 const dt=clamp(t-lt,0,64);lt=t;
 ghostTick(dt);drawBG(dt,t);
 if(S.cur&&S.cur.tick)S.cur.tick(dt,t);
 if(WP.on){
  const p=(performance.now()-WP.t0)/WP.dur;
  if(p>=.5&&!WP.swapped){WP.swapped=true;swap(WP.target)}
  if(p>=1){
   WP.on=false;fxx.clearRect(0,0,fxc.width,fxc.height);S.busy=false;
   if(S.pend!=null){const n=S.pend;S.pend=null;go(n)}
  }else drawWipe(p);
 }
 requestAnimationFrame(frame);
}
/* slide-ul curent în URL (#1 … #21): reîncărcarea păstrează slide-ul */
const fromHash=()=>{const n=parseInt(location.hash.slice(1),10);return n>=1&&n<=N?n-1:0};
addEventListener('hashchange',()=>go(fromHash()));
go(fromHash());requestAnimationFrame(frame);
})();
</script>
